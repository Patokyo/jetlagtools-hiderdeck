<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101319">
  <meta name="description" content="Swipe-driven 100 card hider deck.">
  <title>Hider Deck</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hider Deck">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="./css/reset.css?v=22">
  <link rel="stylesheet" href="./css/layout.css?v=22">
  <link rel="stylesheet" href="./css/card.css?v=22">
</head>
<body>
  <main class="stage" id="stage">
    <header class="hud">
      <dl class="hud__stats">
        <div class="hud__stat">
          <dt>Deck</dt>
          <dd id="deck-count">–</dd>
        </div>
        <div class="hud__stat">
          <dt>Hand</dt>
          <dd id="hand-count">–</dd>
        </div>
        <div class="hud__stat" title="Time bonus kept in hand">
          <dt>Time</dt>
          <dd id="time-total">–</dd>
        </div>
      </dl>
      <div class="hud__actions">
        <button class="hud__icon" id="undo" type="button" aria-label="Undo the last move" title="Undo the last move" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
            <path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
          </svg>
        </button>
        <button class="hud__icon" id="settings-open" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
            <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a6.9 6.9 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
          </svg>
        </button>
        <button class="hud__reset" id="reset" type="button">New run</button>
      </div>
    </header>

    <section class="table">
      <div class="slot" id="slot">
        <div class="stack" id="stack"></div>
      </div>
      <div class="hand" id="hand" role="group" aria-label="Your hand" hidden></div>
      <div class="tray">
        <p class="hint" id="hint" aria-live="polite">Swipe down to draw</p>
      </div>
    </section>
  </main>

  <dialog class="sheet" id="settings" aria-labelledby="settings-title">
    <form method="dialog" class="sheet__inner">
      <header class="sheet__head">
        <h2 id="settings-title">Settings</h2>
        <button class="sheet__close" value="close" aria-label="Close settings">×</button>
      </header>

      <fieldset class="sizes">
        <legend class="sr-only">Time bonus values</legend>
        <label class="size">
          <input type="radio" name="size" value="small">
          <span>Small</span>
          <small>2–12 min</small>
        </label>
        <label class="size">
          <input type="radio" name="size" value="medium">
          <span>Medium</span>
          <small>3–18 min</small>
        </label>
        <label class="size">
          <input type="radio" name="size" value="large">
          <span>Large</span>
          <small>5–30 min</small>
        </label>
      </fieldset>

      <div class="switch-row">
        <span class="switch-row__title">Measurements</span>
        <label class="switch">
          <span class="switch__side">Metric</span>
          <input id="units-switch" type="checkbox" role="switch" aria-label="Use imperial measurements">
          <span class="switch__side">Imperial</span>
        </label>
      </div>

      <p class="sheet__note">
        Time bonus cards show the minutes for the selected game size, and distances
        are shown in the selected units. Changing either updates every card already
        on the table.
      </p>
    </form>
  </dialog>

  <noscript>
    <p class="noscript">This deck needs JavaScript enabled.</p>
  </noscript>

  <script type="module" src="./js/app.js?v=22"></script>
</body>
</html>
